name: release-apk
on:
  push:
    branches: [main]
    paths:
      - 'release/*.apk'
      - '.github/workflows/release.yml'
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload APK to versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -n 1)
          TAG="v$VERSION"
          test -f "release/zuolema-$VERSION.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "做了吗 $VERSION" --notes "做了吗 $VERSION"
          gh release upload "$TAG" "release/zuolema-$VERSION.apk" --clobber
