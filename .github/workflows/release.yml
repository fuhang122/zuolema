name: release-apk
on:
  push:
    branches: [main]
    paths:
      - 'release/zuolema-1.0.0.apk'
      - '.github/workflows/release.yml'
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload APK to v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.0.0 release/zuolema-1.0.0.apk --clobber
